name: Build CV
on:
  push:
    branches: [main]
    paths: ['**.tex']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: Maria_Plakhtieva_CV.tex
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: Maria_Plakhtieva_CV.pdf
